# First series authored with the `thinkers` persona.
# The coverage map / episodes are produced by the Planner into plan/outline.md,
# seeded by research/dossier.md. This file holds series-level config + the angle.
series: "The Long Argument"          # working title — the Planner may refine the through-line/title
description: >
  A history of political thought across the ages: the thinkers, the circumstances they grew
  up in, their ideas, and how those ideas were shaped both by their circumstances and by the
  thinkers who came before them.
persona: thinkers
angle: >
  Trace political thinkers from classical Athens to the modern age. For each, show the
  circumstances and life that formed them, explain their core ideas accurately, and — the
  spine of the series — reveal how each thinker's ideas grew out of BOTH their circumstances
  AND the thinkers who came before them: the genealogy of political thought, one long argument
  handed down and fought over across the centuries.
scope: >
  FIRST plan — cover the thinkers present in the research docket (research/dossier.md + the
  02/03/04 supplements), spanning classical Athens through the modern social-contract capstone
  (Rawls vs. Nozick). Do NOT create episodes for thinkers reserved for a later expansion: the
  reaction/rights set (Burke, Paine, Wollstonecraft) and the 20th-century cluster (Arendt, Berlin,
  Foucault, Habermas, Beauvoir, Fanon, Sen, Schmitt, Hayek, Popper), nor second-tier figures absent
  from the docket (Spinoza, Grotius, More, Erasmus, Bodin, Constant, de Maistre, the anarchists,
  Durkheim, Lenin, Gramsci). End at Rawls/Nozick; a later session extends into the 20th century.
engine: chatterbox
voice: narrator            # add a clip at voices/narrator.wav (see voices/README.txt)
lexicon: lexicon.yaml
target_minutes: 40         # soft default; the Planner sets per-episode lengths (some short, some multi-part)

# Episodes are seeded from plan/outline.md. Scope/tension here are the brief header; the writer
# also receives the full per-episode plan section (anchors, sourced anecdotes, contested points).
episodes:
  - n: 1
    slug: ep01-strong-and-weak
    title: "The Strong and the Weak"
    target_minutes: 30
    scope: >
      The founding axis of the whole series — nomos (law/convention) vs. phusis (nature) — and its
      hardest edge, political realism. The Sophists as its authors; Thucydides as its dramatist.
      Pose the challenge; do NOT answer it (Plato does that in Ep 2). No soul-theory yet.
    tension: >
      If law is only convention and nature only power, then authority is never right — only
      effective. Every later thinker is trying to escape that conclusion.
  - n: 2
    slug: ep02-just-soul
    title: "The Just Soul"
    target_minutes: 45
    scope: >
      Socrates and Plato's answer to Episode 1. The Republic: justice as a condition of the whole,
      the tripartite soul, the guardian class. Boundary: the ideal city and the inner meaning of
      justice — Aristotle's empirical turn is held for Ep 3.
    tension: >
      To make justice more than power, Plato locates it inside the person and above the crowd — but
      the price is a city ruled by experts who abolish family and property. Cure, or second disease?
  - n: 3
    slug: ep03-political-animal
    title: "The Political Animal"
    target_minutes: 40
    scope: >
      Aristotle's Politics as the empirical counter-move to Plato: man as the political animal, the
      citizen who "shares in ruling and being ruled," the classification and mixing of constitutions
      — and the doctrine the series must not flinch from, natural slavery. Boundary: this closes the
      classical Greek arc; Rome's problem — how to make a good constitution last — opens Ep 4.
    tension: >
      The same naturalism that makes the state our fulfillment also makes hierarchy look natural.
      When a thinker reads what IS as what OUGHT to be, whose subordination gets baptized as "nature"?
  - n: 4
    slug: ep04-cycle-and-mixture
    title: "The Cycle and the Mixture"
    target_minutes: 40
    scope: >
      Rome's two great constitutional theorists. Polybius: anacyclosis (the cycle of regimes) and the
      mixed constitution as Rome's secret. Cicero: natural law ("right reason" shared with the gods),
      res publica = res populi, and the mixed constitution deployed to save a dying Republic.
      Boundary: the classical this-worldly faith that a well-built state can be just — which Augustine
      demolishes in Ep 5.
    tension: >
      Two rival sources of authority stand side by side — institutional balance (power checking power)
      and natural law (a moral order above all law) — here uneasy allies. The series will spend
      centuries choosing between them.
  - n: 5
    slug: ep05-two-cities
    title: "Two Cities"
    target_minutes: 35
    scope: >
      Augustine of Hippo, writing as Rome falls. The Two Cities divided by their object of love;
      justice as the absolute measure of any state (a state without it is "a gang of criminals");
      government as a coercive remedy for a fallen world rather than human fulfillment; the seed of
      just war; and the disputed legacy of religious coercion (the Donatist controversy). Boundary:
      the pivot from the classical polis to a Christian world where no earthly city is the highest thing.
    tension: >
      If no worldly order can be truly just, politics stops being the arena of the highest good and
      becomes damage control — the state as necessary evil rather than the place we are completed.
  - n: 6
    slug: ep06-order-of-law
    title: "The Order of Law"
    target_minutes: 40
    scope: >
      Two medieval moves on who holds ultimate authority in Christendom. Aquinas: the hierarchy of law
      (eternal > natural > human, with divine law a revealed supplement) rejoining Aristotle and
      Augustine, reason and faith; an unjust law "is no law at all." Marsilius of Padua: legislative
      authority lodged in the people (the legislator humanus), aimed straight at papal power. Boundary:
      the medieval frame of a single cosmic order; Eps 7-8 step outside it.
    tension: >
      Aquinas makes authority answerable to a reason above it; Marsilius to the people below it. The
      two great later strands — natural rights and popular sovereignty — are both already here in
      embryo, inside a Christian frame neither man has yet left.
  - n: 7
    slug: ep07-rise-and-fall
    title: "The Science of Rise and Fall"
    target_minutes: 40
    scope: >
      Ibn Khaldun — the non-Western pillar and the series' first true social scientist of politics.
      Asabiyyah (group solidarity) as the engine of power; the cyclical rise and fall of dynasties
      over three-to-four generations; the Muqaddimah (1377) and 'ilm al-'umran, a new "science of
      civilization." A deliberately self-contained standalone. Boundary: not a bridge to Europe (that
      transmission line is Aristotle-into-Aquinas, Ep 6) — a parallel, naturalistic answer European
      thought largely missed.
    tension: >
      What actually drives the rise and fall of states — ideas, law, and divine will, or something
      more brutal and measurable: the solidarity that binds a rising group and the luxury that
      dissolves it?
  - n: 8
    slug: ep08-effectual-truth
    title: "The Effectual Truth"
    target_minutes: 40
    scope: >
      Machiavelli and the divorce of politics from morality. The Prince (1513): virtù vs. fortuna,
      the "effectual truth" of how men do live vs. how they ought to, and the autonomy of political
      action. Boundary: this episode severs politics from the cosmic/moral order; Ep 9 (Hobbes)
      rebuilds order from scratch on that cleared ground.
    tension: >
      Must a founder be willing to do genuine evil to achieve public good — is politics a realm with
      its own rules, autonomous from private morality?
  - n: 9
    slug: ep09-war-of-all
    title: "The War of All Against All"
    target_minutes: 40
    scope: >
      Hobbes — the founding move of the modern social contract. The state of nature as a "war of all
      against all"; the covenant; the absolute, undivided sovereign whose legitimacy is protection
      alone; sovereignty by institution vs. acquisition. Boundary: Hobbes founds the contract
      tradition; Locke (Ep 10) is the rival strand, and every difference is set up here.
    tension: >
      To escape the war of all against all, must we hand a single sovereign absolute, undivided
      power — is unlimited authority the only real alternative to chaos?
  - n: 10
    slug: ep10-consent-and-resistance
    title: "Consent and the Right to Resist"
    target_minutes: 40
    scope: >
      Locke — the rival strand of the contract. Natural rights (life, liberty, property); the labour
      theory of property and its two limits; consent as the ground of legitimate government; and the
      most radical move, the right of revolution. Doubles as the series' method exemplar (the
      Cambridge School / Laslett's re-dating). Boundary: the consent branch running forward to Kant
      and Rawls; Rousseau (Ep 11) attacks its foundation — property.
    tension: >
      When does a government forfeit its right to rule, and who gets to decide? And deeper: does
      property have natural limits, or did Locke quietly license unlimited accumulation?
  - n: 11
    slug: ep11-general-will
    title: "The General Will"
    target_minutes: 40
    scope: >
      Rousseau — the contract turned against itself. The corruption thesis; amour de soi vs.
      amour-propre; inequality traced to property and society (Second Discourse); popular
      sovereignty through the general will and the notorious "forced to be free." Boundary:
      Rousseau rejects the Hobbes/Locke state of nature and hands the general will forward to
      Kant; the anti-contract institutional thinkers (Ep 12) are the parallel counter-tradition.
    tension: >
      Can you legitimately force someone to be free? Is the general will the birth of real
      self-government — or the birth of totalitarian coercion wearing the mask of freedom?
  - n: 12
    slug: ep12-machinery-of-order
    title: "The Machinery of Order"
    target_minutes: 45
    scope: >
      Three Enlightenment thinkers who ground political order in something other than a founding
      contract — the counter-tradition to Eps 9-11. Montesquieu: the separation of powers and the
      sociology of regimes. Hume: justice as an artificial virtue / convention, and the demolition
      of contract theory itself. Adam Smith: the impartial spectator and moral sentiments as the
      unplanned glue of society (his economics compressed to a single paragraph, framed morally).
      Boundary: the grown/engineered order that Kant (Ep 13) rejects as mere "what works."
    tension: >
      What actually holds a free society together — a contract we once signed, institutions
      engineered to check power, or conventions and moral sentiments that grew up on their own,
      unplanned and unauthored?
  - n: 13
    slug: ep13-freedom-under-law
    title: "Freedom Under Law"
    target_minutes: 40
    scope: >
      Kant — grounding authority in reason, not welfare, feeling, or habit. One innate right
      (freedom); the Universal Principle of Right; the social contract as an "idea of reason."
      Boundary: Kant completes the contract tradition's rational wing (forward to Rawls) and adopts
      Rousseau's general will; Hegel (Ep 14) attacks his abstraction as empty.
    tension: >
      Should the state try to make its citizens happy — or only secure everyone's equal freedom
      under law, even against their happiness? Is right grounded in outcomes (utility, welfare) or
      in reason itself?
  - n: 14
    slug: ep14-spirit-in-history
    title: "Spirit in History"
    target_minutes: 40
    scope: >
      Hegel — freedom realized, not just willed. Geist actualizing itself in Sittlichkeit (ethical
      life); the movement Family → Civil Society → State; the "emptiness charge" against Kant's
      abstract morality. Boundary: Hegel historicizes and deindividualizes Kant's freedom; Marx
      (Ep 15) will invert Hegel's own method against him.
    tension: >
      Is freedom something the lone individual possesses against society — or something only a
      whole ethical community, with its institutions and its history, can make real?
  - n: 15
    slug: ep15-world-right-side-up
    title: "The World Turned Right-Side Up"
    target_minutes: 40
    scope: >
      Marx — Hegel's method turned against Hegel, and against liberalism. Historical materialism
      (base/superstructure, the development and fettering theses); alienation (four dimensions,
      historically contingent); the critique of liberal rights ("political emancipation" vs. "human
      emancipation," "rights of separation"); the labour theory of value; the debt to Smith and
      Ricardo. Boundary: Marx the theorist in his own words (not the 20th-century states built in
      his name); his collaborator, financier and systematizer Engels gets his own episode next
      (Ep 16) — keep Engels a passing named presence here.
    tension: >
      Are the liberties the series has built toward — Locke's property, Kant's freedom, the rule of
      law — real emancipation? Or a painted superstructure resting on, and disguising, the brute
      question of who owns the means of production?
  - n: 16
    slug: ep16-second-fiddle
    title: "The Second Fiddle"
    target_minutes: 35
    scope: >
      Friedrich Engels out of Marx's shadow — the co-author who named the whole fight. The
      mill-owner's son who ran Manchester cotton by day and bankrolled the critique of capital by
      night; The Condition of the Working Class in England (1845) and "social murder"; Socialism:
      Utopian and Scientific (1880) — how Engels split socialism into "utopian" dreamers and
      "scientific" law (the utopians touched only as his foil; they get their own later episode);
      the state that "withers away"; The Origin of the Family (1884). Boundary: Engels's independent
      contribution and his role packaging Marx into "Marxism" — the utopians and anarchists he framed
      are reserved for a later episode.
    tension: >
      Was Engels the loyal partner who made Marx legible and kept the movement alive — or the man who
      flattened Marx's subtle, historical critique into a rigid "science" of iron laws that helped
      lay the road to twentieth-century dogma?
  - n: 17
    slug: ep17-greatest-happiness
    title: "The Greatest Happiness"
    target_minutes: 40
    scope: >
      The British utilitarians. Bentham: the principle of utility, the felicific calculus, "the
      greatest happiness of the greatest number." J. S. Mill: the reviser — qualitative "higher
      pleasures," and the harm principle / On Liberty. Boundary: the "whatever maximizes happiness"
      answer to legitimacy, and Mill's liberty carve-out — the liberal counterweight to Ep 15's
      collectivism; forward to the rights-based reply (Rawls, the finale).
    tension: >
      Should we judge laws and governments purely by the happiness they produce — and can happiness
      even be measured and summed across people? And Mill's twist: are some pleasures genuinely
      higher than others, or is that snobbery smuggled into a supposedly democratic calculus?
